<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語ノート — My Japanese Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<style>
  :root {
    --paper: #EAE6DA;
    --paper-card: #F4F1E6;
    --ink: #1F2430;
    --ink-soft: #5B5F6B;
    --ink-faint: #8B8E96;
    --indigo: #2B4570;
    --indigo-soft: #5878A6;
    --seal: #B23A2E;
    --seal-ghost: rgba(178,58,46,0.12);
    --success: #4F6F52;
    --hairline: rgba(31,36,48,0.16);
    --hairline-strong: rgba(31,36,48,0.3);
    --focus: #2B4570;
    --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181C;
      --paper-card: #1B2026;
      --ink: #E7E3DA;
      --ink-soft: #A9ADB6;
      --ink-faint: #70747C;
      --indigo: #8CAAD6;
      --indigo-soft: #5878A6;
      --seal: #E07264;
      --seal-ghost: rgba(224,114,100,0.14);
      --success: #86B08A;
      --hairline: rgba(231,227,218,0.14);
      --hairline-strong: rgba(231,227,218,0.28);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181C;
    --paper-card: #1B2026;
    --ink: #E7E3DA;
    --ink-soft: #A9ADB6;
    --ink-faint: #70747C;
    --indigo: #8CAAD6;
    --indigo-soft: #5878A6;
    --seal: #E07264;
    --seal-ghost: rgba(224,114,100,0.14);
    --success: #86B08A;
    --hairline: rgba(231,227,218,0.14);
    --hairline-strong: rgba(231,227,218,0.28);
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top {
    padding-bottom: 18px;
    border-bottom: 1px solid var(--hairline-strong);
    margin-bottom: 18px;
  }
  header.top h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(26px, 6vw, 34px);
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  header.top p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 48ch;
  }

  .top-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
  .ver-line { margin-left: auto; font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
  nav.tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 18px;
    -webkit-overflow-scrolling: touch;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 0 0 auto;
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-soft);
    padding: 10px 14px 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.tabs button .jp { font-family: var(--font-display); font-size: 15px; margin-right: 4px; }
  nav.tabs button.active {
    color: var(--ink);
    border-bottom-color: var(--indigo);
    font-weight: 600;
  }
  nav.tabs button:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .toolbar input[type="search"] {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--hairline-strong);
    background: var(--paper-card);
    color: var(--ink);
    border-radius: 3px;
    font-size: 14px;
  }
  .count-note {
    color: var(--ink-faint);
    font-size: 12px;
    margin: 0 0 12px;
  }

  .entry-list { display: flex; flex-direction: column; }
  .entry-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 14px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .entry-row:first-child { border-top: 1px solid var(--hairline); }
  .seal-chip {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    color: var(--seal);
    border: 1.5px solid var(--seal);
    background: var(--seal-ghost);
    padding: 2px 6px;
    border-radius: 2px;
    transform: rotate(-3deg);
    white-space: nowrap;
    margin-top: 2px;
    cursor: pointer;
  }
  .entry-main .jp-line {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 500;
  }
  .entry-main .reading {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .entry-main .meaning {
    margin-top: 4px;
    font-size: 14px;
  }
  .entry-main .notes {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--ink-faint);
    font-style: italic;
  }
  .cat-mono {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--ink-faint);
    border: 1px solid var(--hairline-strong);
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .row-head { display: flex; gap: 6px; align-items: flex-start; }
  .del-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
  }
  .del-btn:hover { color: var(--seal); }
  .empty-state {
    padding: 40px 10px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
  }

  .fab {
    position: fixed;
    right: max(20px, env(safe-area-inset-right, 0px));
    bottom: max(20px, env(safe-area-inset-bottom, 0px) + 16px);
    width: 48px; height: 48px;
    background: var(--indigo);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--paper-card);
    width: 100%;
    max-width: 560px;
    border-radius: 10px 10px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    max-height: 85vh;
    overflow-y: auto;
  }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; }
    .modal { border-radius: 10px; }
  }
  .modal h2 {
    font-family: var(--font-display);
    font-size: 20px;
    margin: 0 0 14px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--hairline-strong);
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    font-size: 14px;
    font-family: var(--font-body);
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .btn {
    padding: 9px 16px;
    border-radius: 3px;
    border: 1px solid var(--hairline-strong);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    font-size: 14px;
    font-family: var(--font-body);
  }
  .btn.primary {
    background: var(--indigo);
    border-color: var(--indigo);
    color: var(--paper);
    font-weight: 600;
  }

  /* Flashcards */
  .fc-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .fc-controls select { padding: 7px 10px; border-radius: 3px; border: 1px solid var(--hairline-strong); background: var(--paper-card); color: var(--ink); font-size: 13px; }
  .fc-progress { font-size: 12px; color: var(--ink-faint); margin-left: auto; }
  .fc-stage { display: flex; justify-content: center; padding: 20px 0 30px; perspective: 1200px; }
  .fc-card {
    width: 100%;
    max-width: 420px;
    height: 240px;
    position: relative;
    cursor: pointer;
  }
  .fc-card-inner {
    position: relative;
    width: 100%; height: 100%;
    transition: transform 0.45s;
    transform-style: preserve-3d;
  }
  .fc-card.flipped .fc-card-inner { transform: rotateY(180deg); }
  .fc-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border: 1px solid var(--hairline-strong);
    border-radius: 6px;
    background: var(--paper-card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
    background-image:
      repeating-linear-gradient(var(--hairline) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--hairline) 0 1px, transparent 1px 28px);
    background-position: center;
  }
  .fc-face .big-jp {
    font-family: var(--font-display);
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 700;
  }
  .fc-face .fc-reading { margin-top: 8px; color: var(--ink-soft); font-size: 14px; }
  .fc-face.back { transform: rotateY(180deg); }
  .fc-face .fc-meaning { font-size: 17px; font-weight: 600; }
  .fc-face .fc-notes { margin-top: 10px; font-size: 12.5px; color: var(--ink-faint); font-style: italic; max-width: 34ch; }
  .fc-face .hint { position: absolute; bottom: 10px; font-size: 11px; color: var(--ink-faint); }
  .fc-nav { display: flex; justify-content: center; gap: 10px; }

  /* Quiz */
  .quiz-q { font-size: 13px; color: var(--ink-faint); margin-bottom: 6px; }
  .quiz-jp { font-family: var(--font-display); font-size: 28px; margin-bottom: 2px; }
  .quiz-reading { color: var(--ink-soft); margin-bottom: 20px; font-size: 15px; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .quiz-opt {
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--hairline-strong);
    background: var(--paper-card);
    border-radius: 4px;
    font-size: 14.5px;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .quiz-opt:disabled { cursor: default; }
  .quiz-opt.correct { border-color: var(--success); color: var(--success); font-weight: 600; }
  .quiz-opt.wrong { border-color: var(--seal); color: var(--seal); }
  .quiz-mark { font-family: var(--font-display); font-weight: 700; }
  .quiz-feedback-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .quiz-score-line { font-size: 13px; color: var(--ink-soft); }
  .quiz-summary ul { padding-left: 0; list-style: none; margin: 10px 0 0; }
  .quiz-summary li { padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
  .big-score { font-family: var(--font-display); font-size: 40px; text-align: center; margin: 10px 0; }
  .start-row { text-align: center; padding: 30px 0; }
  .start-row p { color: var(--ink-soft); font-size: 14px; max-width: 40ch; margin: 0 auto 16px; }

  footer.app-footer {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  footer.app-footer button {
    background: none; border: none; padding: 0;
    color: var(--ink-faint); text-decoration: underline;
    cursor: pointer; font-size: 12px;
  }

  /* Tag chips bar */
  .tagbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--hairline-strong) transparent; }
  .tagbar::-webkit-scrollbar { height: 4px; }
  .tagbar::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 2px; }
  .tagbar::-webkit-scrollbar-track { background: transparent; }

  /* Sidebar layout for filters & categories (wide screens) */
  .side-title { display: none; }
  .list-main { min-width: 0; }
  @media (min-width: 880px) {
    .app { max-width: 980px; }
    .list-layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 26px; align-items: start; }
    .list-main { grid-column: 2; grid-row: 1; }
    .side-filter { grid-column: 1; grid-row: 1; position: sticky; top: 12px; max-height: calc(100vh - 60px); overflow-y: auto; padding-right: 8px; border-right: 1px solid var(--hairline); scrollbar-width: thin; scrollbar-color: var(--hairline-strong) transparent; }
    .side-filter::-webkit-scrollbar { width: 5px; }
    .side-filter::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 3px; }
    .side-filter::-webkit-scrollbar-track { background: transparent; }
    .side-title { display: block; font-family: var(--font-display); font-size: 13px; color: var(--ink-faint); margin: 0 0 8px; }
    .side-filter .tagbar { flex-direction: column; overflow: visible; align-items: stretch; padding-bottom: 0; margin-bottom: 0; }
    .side-filter .tag-chip { text-align: left; }
    .side-filter .tag-chip.active { transform: none; }
  }
  .tag-chip { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--paper-card); border: 1px solid var(--hairline-strong); border-radius: 3px; padding: 5px 10px; cursor: pointer; font-family: var(--font-body); }
  .tag-chip.active { color: var(--paper); background: var(--seal); border-color: var(--seal); transform: rotate(-1deg); }

  /* Audio buttons */
  .spk { background: none; border: none; cursor: pointer; font-size: 14px; padding: 0 4px; vertical-align: middle; opacity: 0.6; line-height: 1; }
  .spk:hover { opacity: 1; }
  .spk.big { font-size: 20px; }
  .fc-audio { margin-top: 10px; }

  /* Clickable rows */
  .entry-row { cursor: pointer; }
  .entry-row.compact { padding: 10px 0; }
  .entry-row.compact .jp-line { font-size: 16px; }
  .row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 96px; }
  .row-side .seal-chip { transform: rotate(-2deg); font-size: 10.5px; }
  .xfind { margin-top: 22px; }

  /* Dictionary detail view */
  .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 60; display: flex; justify-content: center; align-items: stretch; overflow-y: auto; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
  .detail { background: var(--paper); width: 100%; max-width: 640px; min-height: 100%; padding: 20px 20px calc(40px + env(safe-area-inset-bottom, 0px)); border-radius: 12px 12px 0 0; }
  .detail-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .jisho-link { color: var(--indigo); font-size: 13px; text-decoration: underline; }
  .detail-actions { display: flex; align-items: center; gap: 12px; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 10px; font-size: 13px; color: var(--ink-soft); }
  .pager-size { padding: 5px 8px; border: 1px solid var(--hairline-strong); background: var(--paper-card); color: var(--ink); border-radius: 3px; font-size: 13px; margin-left: 4px; }
  .pager-nav { display: flex; align-items: center; gap: 8px; }
  .pager-nav .btn { padding: 6px 12px; font-size: 13px; }
  .pager-nav .btn:disabled { opacity: 0.4; cursor: default; }
  .pager-pos { min-width: 48px; text-align: center; }
  .field-hint { font-weight: 400; color: var(--ink-faint); font-size: 11px; margin-left: 6px; }
  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; max-height: 170px; overflow-y: auto; padding: 8px; border: 1px solid var(--hairline-strong); border-radius: 3px; background: var(--paper); scrollbar-width: thin; }
  .tag-picker .tag-chip.active { transform: none; }
  .tag-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .tag-add-row input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--hairline-strong); background: var(--paper); color: var(--ink); border-radius: 3px; font-size: 14px; }
  .tag-add-row .btn { white-space: nowrap; padding: 6px 12px; }
  .detail-word { font-family: var(--font-display); font-size: clamp(30px, 8vw, 42px); font-weight: 700; }
  .detail-reading { color: var(--ink-soft); margin-top: 4px; font-size: 16px; }
  .detail-meaning { margin-top: 10px; font-size: 16px; font-weight: 600; }
  .detail-meta { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .detail-meta .seal-chip { cursor: default; }
  .detail-notes { margin-top: 12px; font-size: 13.5px; color: var(--ink-soft); font-style: italic; border-left: 2px solid var(--hairline-strong); padding-left: 10px; }
  .detail-h { font-family: var(--font-display); font-size: 17px; margin: 26px 0 8px; border-bottom: 1px solid var(--hairline); padding-bottom: 6px; }
  .detail-sub { font-size: 12px; color: var(--ink-faint); font-family: var(--font-body); font-weight: 400; margin-left: 8px; }
  .conj-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .conj-table th { text-align: left; font-weight: 600; color: var(--ink-soft); font-size: 12.5px; padding: 8px 10px 8px 0; width: 84px; border-bottom: 1px solid var(--hairline); font-family: var(--font-body); }
  .conj-table td { padding: 8px 0; border-bottom: 1px solid var(--hairline); font-family: var(--font-display); font-size: 16px; }
  .conj-table td.conj-spk { width: 34px; text-align: right; font-family: var(--font-body); }

  /* Numbers & counters tab */
  .num-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0 16px; margin-bottom: 8px; }
  .num-cell { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--hairline); }
  .num-written { font-family: var(--font-display); font-size: 16px; font-weight: 600; min-width: 48px; }
  .num-reading { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
  .num-reading.irr { color: var(--seal); font-weight: 700; }
  .irr-mark { color: var(--seal); font-weight: 700; }
  .num-note { font-size: 12px; color: var(--ink-faint); margin: 2px 0 0; }

  /* Listening practice */
  .pack-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 14px 0 6px; }
  @media (min-width: 620px) { .pack-grid { grid-template-columns: 1fr 1fr; } }
  .pack-card { text-align: left; background: var(--paper-card); border: 1px solid var(--hairline-strong); border-radius: 6px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--ink); font-family: var(--font-body); }
  .pack-card:hover { border-color: var(--indigo); }
  .pack-jp { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
  .pack-en { font-size: 12px; color: var(--ink-faint); }
  .pack-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .listen-slow { font-size: 13px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .listen-controls { display: flex; align-items: center; gap: 14px; margin: 10px 0 14px; }
  .listen-q { font-family: var(--font-display); font-size: 19px; margin: 6px 0 12px; }
  .qr-opts .qr-text { visibility: hidden; flex: 1; text-align: left; margin-left: 10px; }
  .quiz-opt.revealed .qr-text { visibility: visible; }
  .qr-num { font-weight: 700; color: var(--indigo); flex: 0 0 auto; }
  .native-links { display: flex; flex-direction: column; gap: 8px; }
  .native-links a { color: var(--indigo); font-size: 14px; text-decoration: underline; }
  .transcript { display: flex; flex-direction: column; }
  .t-line { display: flex; gap: 10px; align-items: baseline; background: none; border: none; border-bottom: 1px solid var(--hairline); padding: 9px 0 4px; cursor: pointer; text-align: left; color: var(--ink); width: 100%; }
  .t-spk { font-size: 11px; font-weight: 700; color: var(--seal); border: 1px solid var(--seal); border-radius: 2px; padding: 1px 5px; flex: 0 0 auto; }
  .t-jp { font-family: var(--font-display); font-size: 16px; }
  .t-zh { font-size: 12.5px; color: var(--ink-faint); margin: 2px 0 8px 0; }

    {id:"g11",category:"grammar",jp:"[時間]に [人]と [交通工具]で [場所]へ 行きます",reading:"Lesson 5 boss sentence",meaning:"第5課「大魔王句型」：時間＋同伴＋交通工具＋目的地",lesson:"L5",notes:"第5課所有助詞按自然語序排成的完整句。"},
    {id:"g12",category:"grammar",jp:"[受詞] を [動詞]",reading:"... o ...",meaning:"を標記直接受詞",lesson:"L6",notes:"例：ごはんを食べます、本を読みます。"},
    {id:"g13",category:"grammar",jp:"[場所] で [動作]",reading:"... de ...",meaning:"在（某地）做（動作）",lesson:"L6",notes:"で＝動作發生的地點，和表示交通手段的で是不同用法。例：家で食べます。"},
    {id:"g14",category:"grammar",jp:"〜ませんか／〜ましょう",reading:"~masen ka / ~mashou",meaning:"要不要…？（邀請）／…吧！（提議）",lesson:"L6",notes:"〜ませんか用來邀請對方；〜ましょう表示一起做的提議或答應。"},
    {id:"g15",category:"grammar",jp:"[時間]に [場所]で [受詞]を [動詞]",reading:"Lesson 6 boss sentence",meaning:"第6課「大魔王句型」：日常動作的基本骨架",lesson:"L6",notes:"時間＋地點＋受詞＋動詞。"},
    {id:"g16",category:"grammar",jp:"[工具] で [動作]",reading:"... de ...",meaning:"用（工具／方式）做（動作）",lesson:"L7",notes:"で的第三種用法：はしで食べます、日本語で話します。（で共三種：交通手段／動作地點／工具方式）"},
    {id:"g17",category:"grammar",jp:"[人] に [物] を あげます",reading:"... ni ... o agemasu",meaning:"給（某人）（東西）",lesson:"L7",notes:"に標記「接受的那個人」。例：友達に花をあげます。"},
    {id:"g18",category:"grammar",jp:"[人] に／から [物] を もらいます",reading:"... ni/kara ... o moraimasu",meaning:"從（某人）那裡收到（東西）",lesson:"L7",notes:"收到時，「從誰」用に或から都可以。"},
    {id:"g19",category:"grammar",jp:"い形容詞過去式：〜かった",reading:"~katta",meaning:"（過去）很…",lesson:"L8",notes:"い形容詞絕對不能接でした！たかい→たかかった、いい→よかった（不規則）。"},
    {id:"g20",category:"grammar",jp:"な形容詞 ＋ な ＋ 名詞",reading:"... na + meishi",meaning:"…的（名詞）",lesson:"L8",notes:"な只出現在名詞前面（便利な所）；接です時沒有な（便利です）。陷阱：きれい、有名 結尾是い但其實是な形容詞！"}

    {id:"n5g24",category:"grammar",jp:"〜てください",reading:"~te kudasai",meaning:"請（做）…",lesson:"L14",notes:"ちょっと待ってください。"},
    {id:"n5g25",category:"grammar",jp:"〜ましょうか",reading:"~mashou ka",meaning:"我來…好嗎？（主動提議幫忙）",lesson:"L14",notes:"手伝いましょうか。＝我來幫你好嗎？"},
    {id:"n5g26",category:"grammar",jp:"〜ています（現在進行）",reading:"~te imasu (now)",meaning:"正在…",lesson:"L14",notes:"今、雨が降っています。"},
    // --- Grammar L15 ---
    {id:"n5g27",category:"grammar",jp:"〜てもいいです",reading:"~te mo ii desu",meaning:"可以…／…也沒關係",lesson:"L15",notes:"写真を撮ってもいいですか。"},
    {id:"n5g28",category:"grammar",jp:"〜てはいけません",reading:"~te wa ikemasen",meaning:"不可以…（禁止）",lesson:"L15",notes:"ここで たばこを 吸ってはいけません。"},
    {id:"n5g29",category:"grammar",jp:"〜ています（狀態・習慣）",reading:"~te imasu (state/habit)",meaning:"狀態、職業、習慣",lesson:"L15",notes:"大阪に住んでいます。IBMで働いています。知っています。"},
    // --- Grammar L16 ---
    {id:"n5g30",category:"grammar",jp:"〜て、〜て、〜",reading:"~te, ~te",meaning:"做了A，然後B，然後C（動作順序）",lesson:"L16",notes:"朝起きて、ごはんを食べて、会社へ行きます。"},
    {id:"n5g31",category:"grammar",jp:"い形容詞：〜くて／な形容詞・名詞：〜で",reading:"~kute / ~de",meaning:"形容詞的連接：既…又…",lesson:"L16",notes:"安くておいしいです。簡単で便利です。"},
    {id:"n5g32",category:"grammar",jp:"〜てから",reading:"~te kara",meaning:"做完…之後",lesson:"L16",notes:"仕事が終わってから、泳ぎに行きます。"},
    // --- Grammar L17 ---
    {id:"n5g33",category:"grammar",jp:"ない形",reading:"nai-form",meaning:"動詞的普通否定形",lesson:"L17",notes:"行かない・食べない・しない・こない。"},
    {id:"n5g34",category:"grammar",jp:"〜ないでください",reading:"~naide kudasai",meaning:"請不要…",lesson:"L17",notes:"ここに車を止めないでください。"},
    {id:"n5g35",category:"grammar",jp:"〜なければなりません",reading:"~nakereba narimasen",meaning:"必須…（義務）",lesson:"L17",notes:"毎日薬を飲まなければなりません。"},
    {id:"n5g36",category:"grammar",jp:"〜なくてもいいです",reading:"~nakute mo ii desu",meaning:"不…也可以／不必…",lesson:"L17",notes:"明日来なくてもいいです。"},
    // --- Grammar L18 ---
    {id:"n5g37",category:"grammar",jp:"辭書形",reading:"jisho-kei",meaning:"動詞的普通現在形（原形）",lesson:"L18",notes:"行く・食べる・する・くる。"},
    {id:"n5g38",category:"grammar",jp:"〜ことができます",reading:"~koto ga dekimasu",meaning:"會…／能夠…",lesson:"L18",notes:"日本語を話すことができます。"},
    {id:"n5g39",category:"grammar",jp:"しゅみは [辭書形] ことです",reading:"shumi wa ~koto desu",meaning:"我的興趣是…",lesson:"L18",notes:"しゅみは本を読むことです。"},
    {id:"n5g40",category:"grammar",jp:"[辭書形] まえに",reading:"~mae ni",meaning:"…之前",lesson:"L18",notes:"寝るまえに、本を読みます。名詞用 [名詞]のまえに。"},
    // --- Grammar L19 ---
    {id:"n5g41",category:"grammar",jp:"た形 ＋ ことがあります",reading:"~ta koto ga arimasu",meaning:"曾經…過（經驗）",lesson:"L19",notes:"日本へ行ったことがあります。"},
    {id:"n5g42",category:"grammar",jp:"〜たり、〜たりします",reading:"~tari ~tari shimasu",meaning:"做做A、做做B（列舉動作）",lesson:"L19",notes:"週末は映画を見たり、買い物したりします。"},
    {id:"n5g43",category:"grammar",jp:"〜くなります／〜になります",reading:"~ku narimasu / ~ni narimasu",meaning:"變得…",lesson:"L19",notes:"寒くなります（い形）。元気になります（な形・名詞）。25歳になります。"},
    // --- Grammar L20-21 ---
    {id:"n5g44",category:"grammar",jp:"普通形（常體）",reading:"futsuu-kei",meaning:"朋友之間的簡短說法",lesson:"L20",notes:"行く？…うん、行く。禮貌體です／ます ⇄ 常體。"},
    {id:"n5g45",category:"grammar",jp:"[普通形] と思います",reading:"~to omoimasu",meaning:"我覺得／我認為…",lesson:"L21",notes:"明日雨が降ると思います。"},
    {id:"n5g46",category:"grammar",jp:"「〜」と言いました",reading:"~to iimashita",meaning:"（某人）說了…",lesson:"L21",notes:"引用：先生は「あした試験です」と言いました。"},
    // --- Grammar L22-25 ---
    {id:"n5g47",category:"grammar",jp:"[普通形子句] ＋ 名詞",reading:"noun-modifying clause",meaning:"…的（名詞）（名詞修飾句）",lesson:"L22",notes:"これは父がくれた時計です＝這是爸爸給我的手錶。"},
    {id:"n5g48",category:"grammar",jp:"〜とき",reading:"~toki",meaning:"…的時候",lesson:"L23",notes:"国へ帰るとき、かばんを買いました。"},
    {id:"n5g49",category:"grammar",jp:"〜と、〜",reading:"~to, ~",meaning:"一…就…／如果…就…",lesson:"L23",notes:"このボタンを押すと、おつりが出ます。"},
    {id:"n5g50",category:"grammar",jp:"くれます",reading:"kuremasu",meaning:"（別人）給我",lesson:"L24",notes:"授受動詞三兄弟：あげます（我給人）・もらいます（我收到）・くれます（別人給我）。"},
    {id:"n5g51",category:"grammar",jp:"〜てあげます／〜てもらいます／〜てくれます",reading:"~te agemasu / moraimasu / kuremasu",meaning:"幫別人做／請別人幫我做／別人幫我做",lesson:"L24",notes:"授受動詞的「動作版」。"},
    {id:"n5g52",category:"grammar",jp:"〜たら",reading:"~tara",meaning:"如果…／…的話",lesson:"L25",notes:"お金があったら、旅行します。"},
    {id:"n5g53",category:"grammar",jp:"〜ても",reading:"~te mo",meaning:"即使…也…",lesson:"L25",notes:"安くても、買いません。"},

    {id:"wp1",category:"phrase",jp:"今何がいちばん欲しいですか。— パソコンが欲しいです。",reading:"いま なにが いちばん ほしいですか。— ぱそこんが ほしいです",meaning:"What do you want most right now? — A computer.",lesson:"L13",notes:"欲しい takes が"},

    {id:"wp3",category:"phrase",jp:"今何か食べたいですか。— いいえ、何も食べたくないです。",reading:"いま なにか たべたいですか。— いいえ、なにも たべたくないです",meaning:"Do you want to eat something? — No, I don't want anything.",lesson:"L13",notes:"何か (something) → 何も＋negative (nothing)"},

    {id:"wp7",category:"phrase",jp:"疲れましたから、どこも行きませんでした。",reading:"つかれましたから、どこも いきませんでした",meaning:"I was tired, so I didn't go anywhere.",lesson:"L13",notes:"reason から + どこも＋negative"},
    {id:"wp8",category:"phrase",jp:"おなかがすきましたから、晩ご飯を食べましょう。",reading:"おなかが すきましたから、ばんごはんを たべましょう",meaning:"I'm hungry, so let's have dinner.",lesson:"L13",notes:""},

    {id:"wp10",category:"phrase",jp:"暑いですね。のどがかわきましたから、ジュースを買いましょう。",reading:"あついですね。のどが かわきましたから、じゅーすを かいましょう",meaning:"It's hot. I'm thirsty, so let's buy juice.",lesson:"L13",notes:""},
    {id:"wp11",category:"phrase",jp:"すみませんが、ちょっと手伝ってください。",reading:"すみませんが、ちょっと てつだってください",meaning:"Excuse me, could you help me a little?",lesson:"L14",notes:"〜てください"},
    {id:"wp12",category:"phrase",jp:"暑いですね。窓を開けましょうか。— すみません、お願いします。",reading:"あついですね。まどを あけましょうか。— すみません、おねがいします",meaning:"It's hot. Shall I open the window? — Yes please.",lesson:"L14",notes:"accepting a ましょうか offer"},
    {id:"wp13",category:"phrase",jp:"荷物を持ちましょうか。— いいえ、けっこうです。",reading:"にもつを もちましょうか。— いいえ、けっこうです",meaning:"Shall I carry your bag? — No, thank you.",lesson:"L14",notes:"declining a ましょうか offer"},
    {id:"wp14",category:"phrase",jp:"ミラーさんは今何をしていますか。— 田中さんに電話をかけています。",reading:"みらーさんは いま なにを していますか。— たなかさんに でんわを かけています",meaning:"What is Mr Miller doing now? — Calling Mr Tanaka.",lesson:"L14",notes:"〜ています (now)"},

    {id:"wp16",category:"phrase",jp:"5000円でお願いします。— はい、3200円のお釣りです。",reading:"ごせんえんで おねがいします。— はい、さんぜんにひゃくえんの おつりです",meaning:"Here's 5000 yen. — Your change is 3200 yen.",lesson:"L14",notes:"で = paying with"},
    {id:"wp17",category:"phrase",jp:"駅まで迎えに行きましょうか。— お願いします。",reading:"えきまで むかえに いきましょうか。— おねがいします",meaning:"Shall I come pick you up at the station? — Yes please.",lesson:"L14",notes:"迎えに行きます"},
    {id:"wp18",category:"phrase",jp:"この漢字の読み方がわかりません。",reading:"この かんじの よみかたが わかりません",meaning:"I don't know how to read this kanji.",lesson:"L14",notes:"ます-stem + 方 = how to ~"},
    {id:"wp19",category:"phrase",jp:"また香港に遊びに来てくださいね。待っています。",reading:"また ほんこんに あそびに きてくださいね。まっています",meaning:"Please come visit Hong Kong again. I'll be waiting.",lesson:"L14",notes:"待っています = ongoing state"},
    {id:"wp20",category:"phrase",jp:"よくわかりませんから、ゆっくり話してください。",reading:"よく わかりませんから、ゆっくり はなしてください",meaning:"I don't quite understand, so please speak slowly.",lesson:"L14",notes:""},
    {id:"wp21",category:"phrase",jp:"今忙しいですから、あとで来てください。",reading:"いま いそがしいですから、あとで きてください",meaning:"I'm busy now, so please come later.",lesson:"L14",notes:"あとで = later (not すぐ!)"},
    {id:"wp22",category:"phrase",jp:"これは高いですね。もう少し安いのはありませんか。",reading:"これは たかいですね。もうすこし やすいのは ありませんか",meaning:"This is expensive. Do you have a slightly cheaper one?",lesson:"L14",notes:"安いの = a cheap one (の replaces noun)"},
    {id:"wp23",category:"phrase",jp:"用事がありますから、すぐ帰ります。",reading:"ようじが ありますから、すぐ かえります",meaning:"I have something to do, so I'll go home right away.",lesson:"L14",notes:""},
    {id:"wp24",category:"phrase",jp:"みなさん、さようなら。また来週。",reading:"みなさん、さようなら。また らいしゅう",meaning:"Goodbye everyone. See you next week.",lesson:"L14",notes:""},

    {id:"cd1",category:"phrase",jp:"A：はじめまして。リンです。シンガポールから来ました。\nB：はじめまして。田中です。リンさんは学生ですか。\nA：いいえ、会社員です。田中さんも会社員ですか。\nB：はい、そうです。どうぞよろしくお願いします。",reading:"",meaning:"A: Nice to meet you. I'm Lin, from Singapore.\nB: Nice to meet you. I'm Tanaka. Are you a student?\nA: No, I'm a company employee. Are you one too?\nB: Yes. Pleased to meet you.",lesson:"L1|会話",notes:"Focus: は・です・も・〜から来ました"},
    {id:"cd2",category:"phrase",jp:"A：すみません、それは何ですか。\nB：これですか。日本語の辞書です。\nA：その辞書は田中さんのですか。\nB：いいえ、私のじゃありません。先生のです。",reading:"",meaning:"A: Excuse me, what is that?\nB: This? It's a Japanese dictionary.\nA: Is that dictionary yours, Mr Tanaka?\nB: No, it isn't mine. It's the teacher's.",lesson:"L2|会話",notes:"Focus: これ・それ・あれ, の (possession)"},
    {id:"cd3",category:"phrase",jp:"A：すみません、時計売り場はどこですか。\nB：三階です。エレベーターはあちらです。\nA：この時計はいくらですか。\nB：八千円です。\nA：じゃ、これをください。",reading:"",meaning:"A: Excuse me, where is the watch department?\nB: The third floor. The elevator is over there.\nA: How much is this watch?\nB: 8,000 yen.\nA: I'll take this one, then.",lesson:"L3|会話",notes:"Focus: ここ・そこ・どこ, いくら, 〜をください"},
    {id:"cd4",category:"phrase",jp:"A：銀行は何時から何時までですか。\nB：九時から三時までです。\nA：土曜日も同じですか。\nB：いいえ、土曜日と日曜日は休みです。",reading:"",meaning:"A: What are the bank's hours?\nB: From 9 to 3.\nA: Is Saturday the same?\nB: No, it's closed on Saturdays and Sundays.",lesson:"L4|会話",notes:"Focus: 〜時, 〜から〜まで"},
    {id:"cd5",category:"phrase",jp:"A：週末、どこへ行きますか。\nB：友達と京都へ行きます。\nA：いいですね。何で行きますか。\nB：新幹線で行きます。日曜日の夜に帰ります。",reading:"",meaning:"A: Where are you going this weekend?\nB: I'm going to Kyoto with a friend.\nA: Nice. How are you getting there?\nB: By Shinkansen. I'll come back on Sunday night.",lesson:"L5|会話",notes:"Focus: へ行きます, と (with), で (transport), に (time)"},
    {id:"cd6",category:"phrase",jp:"A：日曜日、いっしょに映画を見ませんか。\nB：いいですね。どこで会いましょうか。\nA：十時に駅で会いましょう。\nB：わかりました。じゃ、また日曜日に。",reading:"",meaning:"A: Would you like to see a movie together on Sunday?\nB: Sounds good. Where shall we meet?\nA: Let's meet at the station at ten.\nB: Got it. See you Sunday.",lesson:"L6|会話",notes:"Focus: を, で (place of action), 〜ませんか・〜ましょう"},
    {id:"cd7",category:"phrase",jp:"A：きれいな時計ですね。\nB：ありがとうございます。誕生日に父にもらいました。\nA：いいですね。もう昼ご飯を食べましたか。\nB：いいえ、まだです。いっしょに食べませんか。",reading:"",meaning:"A: That's a beautiful watch.\nB: Thank you. I got it from my father for my birthday.\nA: Nice. Have you had lunch yet?\nB: No, not yet. Shall we eat together?",lesson:"L7|会話",notes:"Focus: もらいます (に), もう・まだ"},
    {id:"cd8",category:"phrase",jp:"A：新しい仕事はどうですか。\nB：忙しいですが、面白いです。\nA：会社の人はどうですか。\nB：みんな親切です。とてもいい会社です。",reading:"",meaning:"A: How is the new job?\nB: It's busy, but interesting.\nA: How are the people at the company?\nB: Everyone is kind. It's a very good company.",lesson:"L8|会話",notes:"Focus: い／な-adjectives, 〜が、〜 (but), どうですか"},
    {id:"cd9",category:"phrase",jp:"A：どんなスポーツが好きですか。\nB：サッカーが好きです。でも、あまり上手じゃありません。\nA：今晩、テレビでサッカーを見ませんか。\nB：すみません、今晩は用事がありますから…。",reading:"",meaning:"A: What kind of sports do you like?\nB: I like soccer. But I'm not very good at it.\nA: Shall we watch soccer on TV tonight?\nB: Sorry, I have something to do tonight...",lesson:"L9|会話",notes:"Focus: が好き・上手, あまり〜ません, から (reason)"},
    {id:"cd10",category:"phrase",jp:"A：すみません、この近くにコンビニがありますか。\nB：ええ、あのビルの中にあります。\nA：ビルのどこですか。\nB：一階です。本屋の隣にありますよ。",reading:"",meaning:"A: Excuse me, is there a convenience store near here?\nB: Yes, there's one inside that building.\nA: Where in the building?\nB: The first floor. It's next to the bookstore.",lesson:"L10|会話",notes:"Focus: あります・います, position words"},
    {id:"cd11",category:"phrase",jp:"A：りんごを五つと、みかんを三つください。\nB：はい。全部で九百円です。\nA：それから、切手を二枚お願いします。\nB：すみません、切手は郵便局でお願いします。",reading:"",meaning:"A: Five apples and three mandarins, please.\nB: Sure. That's 900 yen altogether.\nA: And two stamps, please.\nB: Sorry, please get stamps at the post office.",lesson:"L11|会話",notes:"Focus: counters (〜つ・〜枚), 全部で"},
    {id:"cd12",category:"phrase",jp:"A：旅行はどうでしたか。\nB：とても楽しかったです。でも、少し寒かったです。\nA：京都と奈良と、どちらがよかったですか。\nB：京都のほうがよかったです。食べ物がいちばんおいしかったです。",reading:"",meaning:"A: How was your trip?\nB: It was a lot of fun. But a little cold.\nA: Which was better, Kyoto or Nara?\nB: Kyoto was better. The food was the best part.",lesson:"L12|会話",notes:"Focus: past adjectives, どちら・のほうが・いちばん"},
    {id:"cd13",category:"phrase",jp:"A：のどがかわきましたね。何か飲みたいですね。\nB：そうですね。あの喫茶店に入りませんか。\nA：いいですね。私は冷たいジュースが飲みたいです。\nB：じゃ、行きましょう。",reading:"",meaning:"A: I'm thirsty. I'd like something to drink.\nB: Me too. Shall we go into that café?\nA: Good idea. I want a cold juice.\nB: Let's go, then.",lesson:"L13|会話",notes:"Focus: 〜たい, 何か, に入ります"},
    {id:"cd14",category:"phrase",jp:"A：すみません、この住所へ行きたいです。地図をかいてください。\nB：はい。この道をまっすぐ行って、二つ目の信号を左へ曲がってください。\nA：ありがとうございます。\nB：雨が降っていますね。傘を貸しましょうか。",reading:"",meaning:"A: Excuse me, I want to go to this address. Please draw me a map.\nB: Sure. Go straight along this road and turn left at the second light.\nA: Thank you.\nB: It's raining. Shall I lend you an umbrella?",lesson:"L14|会話",notes:"Focus: 〜てください, 〜ています, 〜ましょうか"},
    {id:"cd15",category:"phrase",jp:"A：ここで写真を撮ってもいいですか。\nB：すみません、ここでは撮ってはいけません。\nA：そうですか。ご家族は東京に住んでいますか。\nB：いいえ、大阪に住んでいます。父は銀行で働いています。",reading:"",meaning:"A: May I take photos here?\nB: Sorry, you mustn't take photos here.\nA: I see. Does your family live in Tokyo?\nB: No, they live in Osaka. My father works at a bank.",lesson:"L15|会話",notes:"Focus: 〜てもいい, 〜てはいけません, 〜ています (state)"},
    {id:"cd16",category:"phrase",jp:"A：毎朝何をしますか。\nB：六時に起きて、シャワーを浴びて、会社へ行きます。\nA：新しい部屋はどうですか。\nB：広くて、明るいです。駅から近くて便利です。",reading:"",meaning:"A: What do you do every morning?\nB: I get up at six, take a shower, and go to work.\nA: How is your new room?\nB: It's spacious and bright. It's close to the station and convenient.",lesson:"L16|会話",notes:"Focus: 〜て、〜て (sequence), 〜くて・〜で (linking adjectives)"},
    {id:"cd17",category:"phrase",jp:"A：熱がありますね。今日はお風呂に入らないでください。\nB：はい。薬を飲まなければなりませんか。\nA：ええ、一日に三回飲んでください。\nB：明日も来なければなりませんか。\nA：いいえ、来なくてもいいです。",reading:"",meaning:"A: You have a fever. Please don't take a bath today.\nB: OK. Do I have to take medicine?\nA: Yes, take it three times a day.\nB: Do I have to come again tomorrow?\nA: No, you don't have to.",lesson:"L17|会話",notes:"Focus: 〜ないでください, 〜なければなりません, 〜なくてもいい"},
    {id:"cd18",category:"phrase",jp:"A：趣味は何ですか。\nB：写真を撮ることです。田中さんは？\nA：私はピアノを弾くことができます。\nB：すごいですね。寝るまえに、いつも練習しますか。",reading:"",meaning:"A: What's your hobby?\nB: Taking photos. How about you?\nA: I can play the piano.\nB: Wow. Do you always practice before going to bed?",lesson:"L18|会話",notes:"Focus: dictionary form: 〜こと, 〜ことができます, 〜まえに"},
    {id:"cd19",category:"phrase",jp:"A：日本料理を食べたことがありますか。\nB：はい、あります。すしを食べたり、天ぷらを食べたりしました。\nA：日本語が上手になりましたね。\nB：いいえ、まだまだです。",reading:"",meaning:"A: Have you ever eaten Japanese food?\nB: Yes, I have. I've had sushi, tempura and so on.\nA: Your Japanese has become good.\nB: No, not yet at all.",lesson:"L19|会話",notes:"Focus: 〜たことがあります, 〜たり〜たり, 〜になります"},
    {id:"cd20",category:"phrase",jp:"A：今晩、ひま？\nB：うん、ひまだよ。どうして？\nA：いっしょにご飯を食べない？\nB：いいね。何時に行く？\nA：七時はどう？",reading:"",meaning:"A: Free tonight?\nB: Yeah, I'm free. Why?\nA: Want to grab dinner together?\nB: Sounds good. What time are we going?\nA: How about seven?",lesson:"L20|会話",notes:"Focus: plain form: か is dropped, うん・ううん, 〜ない？ as invitation"},
    {id:"cd21",category:"phrase",jp:"A：明日の試験は難しいと思いますか。\nB：ええ、難しいと思います。先生は「漢字が多い」と言いました。\nA：そうですか。私も今晩勉強しなければなりません。\nB：がんばりましょう。",reading:"",meaning:"A: Do you think tomorrow's exam will be hard?\nB: Yes, I think so. The teacher said there'll be a lot of kanji.\nA: I see. I have to study tonight too.\nB: Let's do our best.",lesson:"L21|会話",notes:"Focus: 〜と思います, 〜と言いました"},
    {id:"cd22",category:"phrase",jp:"A：あの眼鏡をかけている人はだれですか。\nB：山田さんです。私がいちばん好きな先生です。\nA：これは山田先生が書いた本ですか。\nB：ええ、去年書いた本です。",reading:"",meaning:"A: Who is that person wearing glasses?\nB: That's Ms Yamada. She's my favourite teacher.\nA: Is this the book Ms Yamada wrote?\nB: Yes, the one she wrote last year.",lesson:"L22|会話",notes:"Focus: noun-modifying clauses"},
    {id:"cd23",category:"phrase",jp:"A：すみません、切符が出ません。\nB：お金を入れて、このボタンを押すと、出ますよ。\nA：ありがとうございます。\nB：わからないときは、いつでも聞いてください。",reading:"",meaning:"A: Excuse me, the ticket won't come out.\nB: Put in the money, press this button, and it comes out.\nA: Thank you.\nB: Whenever you don't understand, please ask.",lesson:"L23|会話",notes:"Focus: 〜と (when/if), 〜とき"},
    {id:"cd24",category:"phrase",jp:"A：いいかばんですね。\nB：ありがとうございます。姉が買ってくれました。\nA：引っ越しは一人でしましたか。\nB：いいえ、友達に手伝ってもらいました。",reading:"",meaning:"A: That's a nice bag.\nB: Thank you. My older sister bought it for me.\nA: Did you move house by yourself?\nB: No, I had my friends help me.",lesson:"L24|会話",notes:"Focus: 〜てくれます, 〜てもらいます"},
    {id:"cd25",category:"phrase",jp:"A：もし雨が降ったら、どうしますか。\nB：雨が降っても、行きます。\nA：駅に着いたら、電話をください。\nB：はい、わかりました。",reading:"",meaning:"A: What will you do if it rains?\nB: Even if it rains, I'll go.\nA: When you get to the station, give me a call.\nB: Sure, will do.",lesson:"L25|会話",notes:"Focus: 〜たら, 〜ても"},

  var CAT_LABEL = {vocab:"語", phrase:"句", grammar:"文"};

  var seedById = {};
  SEED.forEach(function(e){ seedById[e.id] = e; });

  // ---------- Storage: only the user's own additions & deletions are saved,
  // so seed content can keep improving between versions ----------
  var USER_KEY = "jpNotebookUser_v2";
  var LEGACY_KEY = "jpNotebookEntries_v1";
  function loadUserState(){
    try {
      var raw = localStorage.getItem(USER_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.added) && Array.isArray(s.deletedSeedIds)) { if (!s.overrides || typeof s.overrides !== "object") s.overrides = {}; return s; }
      }
    } catch (e) {}
    try {
      var old = localStorage.getItem(LEGACY_KEY);
      if (old) {
        var arr = JSON.parse(old);
        if (Array.isArray(arr)) {
          var added = arr.filter(function(en){ return en && typeof en.id === "string" && en.id.indexOf("u-") === 0; });
          return {added: added, deletedSeedIds: [], overrides: {}};
        }
      }
    } catch (e) {}
    return {added: [], deletedSeedIds: [], overrides: {}};
  }
  var userState = loadUserState();
  function saveUserState(){
    try { localStorage.setItem(USER_KEY, JSON.stringify(userState)); }
    catch (e) { console.warn("Could not save to this browser's storage:", e); }
  }
  saveUserState();

  function allEntries(){
    var del = {};
    userState.deletedSeedIds.forEach(function(id){ del[id] = true; });
    return SEED.filter(function(e){ return !del[e.id]; }).map(function(e){
      var o = userState.overrides[e.id];
      if (!o) return e;
      var c = {};
      for (var k in e) c[k] = e[k];
      for (var k2 in o) c[k2] = o[k2];
      return c;
    }).concat(userState.added);
  }
  var entries = allEntries();
  function refreshEntries(){ entries = allEntries(); }
  function entriesById(id){
    for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i];
    return null;
  }
  function deleteEntry(id){
    if (seedById[id]) {
      if (userState.deletedSeedIds.indexOf(id) === -1) userState.deletedSeedIds.push(id);
    } else {
      userState.added = userState.added.filter(function(e){ return e.id !== id; });
    }
    saveUserState();
    refreshEntries();
  }

  function activateTab(btn){
    if (!btn) return;
    activeTab = btn.getAttribute("data-tab");
    searchText = "";
    tagFilter = "";
    numDrill = null;
    qpDrill = null;
    verbDrill = null;
    partDrill = null;
    listenView = "home";
    qrDrill = null;
    convDrill = null;
    stopSpeech();
    closeDetail();
    Array.prototype.forEach.call(tabsNav.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b === btn);
    });
    render();
  }
  tabsNav.addEventListener("click", function(e){ activateTab(e.target.closest("button[data-tab]")); });
  tabsNav.style.gridTemplateColumns = "repeat(" + Math.ceil(tabsNav.querySelectorAll("button[data-tab]").length / 2) + ", minmax(0, 1fr))";
  function stepTab(dir){
    var bs = Array.prototype.slice.call(tabsNav.querySelectorAll("button[data-tab]")), i = 0;
    bs.forEach(function(b, k){ if (b.classList.contains("active")) i = k; });
    activateTab(bs[(i + dir + bs.length) % bs.length]);
  }
  document.getElementById("tabPrev").addEventListener("click", function(){ stepTab(-1); });
  document.getElementById("tabNext").addEventListener("click", function(){ stepTab(1); });
  document.getElementById("tabFirst").addEventListener("click", function(){ var bs = tabsNav.querySelectorAll("button[data-tab]"); activateTab(bs[0]); });
  document.getElementById("tabLast").addEventListener("click", function(){ var bs = tabsNav.querySelectorAll("button[data-tab]"); activateTab(bs[bs.length - 1]); });

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });

  function kataToHira(s){

  // ---------- Audio (browser ja-JP speech) ----------
  var jaVoice = null;
  function pickVoice(){
    if (!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++) {
      if ((vs[i].lang || "").toLowerCase().indexOf("ja") === 0) { jaVoice = vs[i]; return; }
    }
  }

    pickVoice();
    if (typeof speechSynthesis.onvoiceschanged !== "undefined") speechSynthesis.onvoiceschanged = pickVoice;
  }
  var audioWarned = false;
  function speak(text){
    if (!text) return;
    if (!window.speechSynthesis) {
      if (!audioWarned) { alert("This browser does not support speech. Try Chrome, Safari or Edge."); audioWarned = true; }
      return;
    }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      if (jaVoice) u.voice = jaVoice;
      u.rate = 0.9;

  function tagCompare(a, b){
    var ka = lessonSortKey(a), kb = lessonSortKey(b);

    return ka[2] < kb[2] ? -1 : 1;

  var ANT_PAIRS = [["大きい", "小さい"], ["新しい", "古い"], ["いい／良い", "悪い"], ["暑い", "寒い"], ["熱い", "冷たい"], ["難しい", "易しい"], ["難しい", "簡単"], ["高い", "安い"], ["高い", "低い"], ["多い", "少ない"], ["早い", "遅い"], ["速い", "遅い"], ["近い", "遠い"], ["広い", "狭い"], ["重い", "軽い"], ["長い", "短い"], ["明るい", "暗い"], ["強い", "弱い"], ["面白い", "つまらない"], ["たのしい", "つまらない"], ["おいしい", "まずい"], ["白い", "黒い"], ["暖かい", "涼しい"], ["甘い", "辛い"], ["忙しい", "暇"], ["静か", "にぎやか"], ["静か", "うるさい"], ["好き", "嫌い"], ["上手", "下手"], ["便利", "不便"], ["きれい", "汚い"], ["太い", "細い"], ["厚い", "薄い"]];

  function renderList(category){

    });

    content.innerHTML = '<div class="list-layout"><div class="list-main">' + main + '</div>' + side + '</div>';

    renderResults(category);

    // The search box itself is never re-rendered while typing, so IME composition

    var searchBox = document.getElementById("searchBox");

  function renderResults(category){
    var box = document.getElementById("listResults");
    if (!box) return;
    var q = norm(searchText.trim());
    var list = entries.filter(function(e){ return e.category === category; });
    if (tagFilter) list = list.filter(function(e){ return tagsOf(e).indexOf(tagFilter) !== -1; });
    if (q) list = list.filter(function(e){ return matches(e, q); });

    var total = list.length;
    var pages = Math.max(1, Math.ceil(total / pageSize));
    if (pageIdx >= pages) pageIdx = pages - 1;
    if (pageIdx < 0) pageIdx = 0;
    var start = pageIdx * pageSize;
    var pageItems = list.slice(start, start + pageSize);
    function pagerHtml(){
      return '<div class="pager"><label class="pager-size-wrap">Show <select class="pager-size">' +
        [10,20,50].map(function(n){ return '<option value="' + n + '"' + (pageSize === n ? ' selected' : '') + '>' + n + '</option>'; }).join("") +
        '</select></label><span class="pager-nav"><button class="btn pager-prev"' + (pageIdx === 0 ? ' disabled' : '') + '>‹ Prev</button><span class="pager-pos">' + (pageIdx + 1) + ' / ' + pages + '</span><button class="btn pager-next"' + (pageIdx >= pages - 1 ? ' disabled' : '') + '>Next ›</button></span></div>';
    }
    var html = '<p class="count-note">' + total + ' ' + (total === 1 ? "entry" : "entries") + (tagFilter ? ' · ' + escapeHtml(tagFilter) : '') + (total > pageSize ? ' · showing ' + (start + 1) + '–' + Math.min(start + pageSize, total) : '') + ' — tap a word for examples &amp; conjugation</p>';
    if (!total) {
      html += '<div class="empty-state">Nothing matches here. Try "All", clear the search, or tap + to add.</div>';
    } else {
      if (total > 10) html += pagerHtml();
      html += '<div class="entry-list">';
      pageItems.forEach(function(e){ html += rowHtml(e, false); });
      html += '</div>';
      if (total > pageSize) html += pagerHtml();
    }
    if (q) {
      var TAB_NAME = {vocab: "語彙 Vocabulary", phrase: "フレーズ Phrases", grammar: "文法 Grammar"};
      ["vocab", "phrase", "grammar"].forEach(function(cat){
        if (cat === category) return;
        var others = entries.filter(function(e){ return e.category === cat && matches(e, q); }).slice(0, 8);
        if (others.length) {
          html += '<p class="count-note xfind">Also found in <strong>' + TAB_NAME[cat] + '</strong> (' + others.length + '):</p><div class="entry-list">';
          others.forEach(function(e){ html += rowHtml(e, true); });
          html += '</div>';
        }
      });

    if (q) {
      var vhits = VERB_LIST.filter(function(v){ return verbHay(v).indexOf(q) !== -1; }).slice(0, 6);

      sel.addEventListener("change", function(){ pageSize = parseInt(sel.value, 10); savePageSize(); pageIdx = 0; renderResults(category); });
    });

      b.addEventListener("click", function(){ if (pageIdx > 0) { pageIdx--; renderResults(category); box.scrollIntoView({block: "start", behavior: "smooth"}); } });
    });
    box.querySelectorAll(".pager-next").forEach(function(b){
      b.addEventListener("click", function(){ pageIdx++; renderResults(category); box.scrollIntoView({block: "start", behavior: "smooth"}); });

    box.querySelectorAll("[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();

    });
    box.querySelectorAll(".seal-chip[data-lesson]").forEach(function(chip){
      chip.addEventListener("click", function(ev){
        ev.stopPropagation();
        var t = chip.getAttribute("data-lesson") || "";
        var row = chip.closest(".entry-row");
        var owner = row ? entriesById(row.getAttribute("data-open")) : null;
        if (owner && owner.category === category) { tagFilter = t; searchText = ""; }

  }

  // ---------- Dictionary detail view ----------
  function baseWordOf(e){
    return String(e.jp).replace(/（な）/g, "").split("／")[0].trim();
  }
  function conjugationFor(e){
    if (e.category !== "vocab") return null;
    var jp = e.jp, notes = e.notes || "";
    if (/[〜～\[]/.test(jp)) return null;
    if (jp === "いい／良い") {
      return {kind: "い形容詞（不規則）", rows: [
        ["現在", "いいです"], ["否定", "よくないです"], ["過去", "よかったです"], ["過去否定", "よくなかったです"], ["副詞形", "よく"]
      ]};
    }
    var isNa = /な-adjective|な形容詞/.test(notes) || /（な）/.test(jp);
    var isI = !isNa && /い-adjective|い形容詞/.test(notes);
    var r = String(e.reading || "").split("／")[0].trim();
    var rOk = /^[\u3040-\u30FF\u30FCー]+$/.test(r);
    if (isNa) {
      var b = baseWordOf(e), br = rOk ? r : b;
      return {kind: "な形容詞", rows: [
        ["現在", b + "です", br + "です"],
        ["否定", b + "じゃありません", br + "じゃありません"],
        ["過去", b + "でした", br + "でした"],
        ["過去否定", b + "じゃありませんでした", br + "じゃありませんでした"],
        ["接名詞", b + "な＋名詞", br + "な"]
      ]};
    }
    if (isI && /い$/.test(jp)) {
      var stem = jp.slice(0, -1);
      var rstem = (rOk && /い$/.test(r)) ? r.slice(0, -1) : stem;
      return {kind: "い形容詞", rows: [
        ["現在", stem + "いです", rstem + "いです"],
        ["否定", stem + "くないです", rstem + "くないです"],
        ["過去", stem + "かったです", rstem + "かったです"],
        ["過去否定", stem + "くなかったです", rstem + "くなかったです"],
        ["副詞形", stem + "く", rstem + "く"]
      ]};
    }

  function crossRefs(e){
    var base = baseWordOf(e);
    if (!base) return [];
    if (base.length < 2 && !/[\u4E00-\u9FFF]/.test(base)) return [];
    var refs = [];
    for (var i = 0; i < entries.length; i++) {
      var o = entries[i];
      if (o.id === e.id) continue;
      if ((o.jp && o.jp.indexOf(base) !== -1) || (o.notes && o.notes.indexOf(base) !== -1)) refs.push(o);
      if (refs.length >= 6) break;
    }
    return refs;
  }

  var numDrill = null;
  function numPool(){
    var pool = [];
    NUM_SECTIONS.forEach(function(s){
      s.rows.forEach(function(r){
        var item = {written: r[0], reading: r[1], irr: !!r[2], section: s.title};
        pool.push(item);
        if (item.irr) pool.push(item);
      });
    });
    return pool;
  }
  function startNumDrill(){
    var pool = numPool();
    var qs = [];
    var used = {};
    var guard = 0;
    while (qs.length < 10 && guard++ < 500) {
      var it = pool[Math.floor(Math.random() * pool.length)];
      var key = it.written + "|" + it.reading;
      if (used[key]) continue;
      used[key] = true;
      var sect = null;
      for (var i = 0; i < NUM_SECTIONS.length; i++) if (NUM_SECTIONS[i].title === it.section) sect = NUM_SECTIONS[i];
      var others = sect.rows.map(function(r){ return r[1]; }).filter(function(x){ return x !== it.reading; });
      others = shuffleArr(others).slice(0, 3);
      while (others.length < 3) others.push(pool[Math.floor(Math.random() * pool.length)].reading);
      qs.push({item: it, options: shuffleArr([it.reading].concat(others))});
    }
    numDrill = {questions: qs, idx: 0, score: 0, answered: false, missed: []};
  }
  function renderNumbers(){
    if (numDrill) { renderNumDrill(); return; }
    var html = '<p class="count-note">數字・量詞讀音總表——<span class="irr-mark">紅色＝不規則讀音</span>（考試最愛考的地方）。</p>' +

  function renderNumDrill(){
    var d = numDrill;
    if (d.idx >= d.questions.length) {
      var html = '<div class="quiz-summary"><div class="big-score">' + d.score + ' / ' + d.questions.length + '</div>';
      if (d.missed.length) {
        html += '<p class="count-note">要再看一次：</p><ul>';
        d.missed.forEach(function(m){ html += '<li><strong>' + escapeHtml(m.written) + '</strong> ＝ <span class="irr-mark">' + escapeHtml(m.reading) + '</span> <span class="detail-sub">' + escapeHtml(m.section) + '</span> ' + speakerBtn(m.reading.split("／")[0].replace(/[（）]/g, "")) + '</li>'; });
        html += '</ul>';
      } else {
        html += '<p class="count-note">全對——完璧です！</p>';
      }
      html += '<div class="start-row"><button class="btn primary" id="numAgain">再來一次</button> <button class="btn" id="numBack">回到總表</button></div></div>';
      content.innerHTML = html;
      document.getElementById("numAgain").addEventListener("click", function(){ startNumDrill(); renderNumbers(); });
      document.getElementById("numBack").addEventListener("click", function(){ numDrill = null; renderNumbers(); });
      wireSpeakers();
      return;
    }
    var q = d.questions[d.idx];
    var html2 = '<div class="quiz-feedback-row"><span class="quiz-q">第 ' + (d.idx + 1) + ' 題／共 ' + d.questions.length + ' 題 · ' + escapeHtml(q.item.section) + '</span><span class="quiz-score-line">Score: ' + d.score + '</span></div>';
    html2 += '<div class="quiz-jp">' + escapeHtml(q.item.written) + '</div>';
    html2 += '<p class="count-note">怎麼唸？</p>';
    html2 += '<div class="quiz-options">';
    q.options.forEach(function(opt){
      html2 += '<button class="quiz-opt" data-r="' + escapeHtml(opt) + '">' + escapeHtml(opt) + '<span class="quiz-mark"></span></button>';
    });
    html2 += '</div><div class="start-row" id="numNextWrap" style="display:none;"><button class="btn primary" id="numNext">下一題</button></div>';
    content.innerHTML = html2;
    var btns = content.querySelectorAll(".quiz-opt");
    btns.forEach(function(b){
      b.addEventListener("click", function(){
        if (d.answered) return;
        d.answered = true;
        var chosen = b.getAttribute("data-r");
        var ok = chosen === q.item.reading;
        if (ok) d.score++; else d.missed.push(q.item);
        btns.forEach(function(b2){
          b2.disabled = true;
          var mk = b2.querySelector(".quiz-mark");
          if (b2.getAttribute("data-r") === q.item.reading) { b2.classList.add("correct"); mk.textContent = "◯"; }
          else if (b2.getAttribute("data-r") === chosen) { b2.classList.add("wrong"); mk.textContent = "✗"; }
        });
        speak(q.item.reading.split("／")[0].replace(/[（）]/g, ""));
        document.getElementById("numNextWrap").style.display = "block";
      });
    });
    document.getElementById("numNext").addEventListener("click", function(){
      d.idx++;
      d.answered = false;
      renderNumDrill();
    });
  }

  function stopSpeech(){ if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} } }
  function speakSeq(parts){
    if (!window.speechSynthesis) {
      if (!audioWarned) { alert("This browser does not support speech. Try Chrome, Safari or Edge."); audioWarned = true; }
      return;
    }
    try {
      speechSynthesis.cancel();
      var rate = listenSlow ? 0.72 : 0.95;
      parts.forEach(function(p){
        var u = new SpeechSynthesisUtterance(p.t);
        u.lang = "ja-JP";
        if (jaVoice) u.voice = jaVoice;
        u.rate = rate;
        u.pitch = p.p || 1;
        speechSynthesis.speak(u);
      });
    } catch (e) {}
  }
  function spkPitch(spk){ return spk === "女" ? 1.25 : 0.75; }
  function qrPlayParts(q){
    var parts = [{t: q.item.q, p: 1}];
    for (var i = 0; i < q.shuffled.length; i++) parts.push({t: (i + 1) + "番。" + q.shuffled[i], p: 0.85});
    return parts;
  }
  function convPlayParts(item){
    var parts = item.lines.map(function(l){ return {t: l[1], p: spkPitch(l[0])}; });
    parts.push({t: item.q, p: 1});
    return parts;
  }
  function buildListenDrill(items){
    var qs = shuffleArr(items).map(function(it){
      return {item: it, shuffled: shuffleArr(it.opts.slice()), correct: it.opts[0]};
    });
    return {questions: qs, idx: 0, score: 0, answered: false, missed: []};
  }

  var qpFilter = "", qpDrill = null;
  function qpSpeakable(t){ return !/[［＿★（）〜／…]/.test(t); }

  function qpPool(groups){
    var pool = [];
    groups.forEach(function(g){ g.pats.forEach(function(p){
      if (qpSpeakable(p[0]) && p[1]) pool.push([p[0], p[1]]);
      p[2].forEach(function(v){ if (v[1] && !/[→＝]/.test(v[0])) pool.push([v[0], v[1]]); });
    }); });
    return pool;
  }
  function startQPDrill(){
    var pool = qpPool(qpGroups());
    if (pool.length < 6) pool = qpPool(QP_GROUPS);
    var seen = {};
    pool = pool.filter(function(it){ if (seen[it[0]]) return false; seen[it[0]] = true; return true; });
    var qs = shuffleArr(pool).slice(0, 10).map(function(it){
      var ds = [], g = 0;
      while (ds.length < 3 && g++ < 120) { var o = pick(pool)[1]; if (o !== it[1] && ds.indexOf(o) === -1) ds.push(o); }
      return {jp: it[0], zh: it[1], options: shuffleArr([it[1]].concat(ds))};
    });
    qpDrill = {questions: qs, idx: 0, score: 0, answered: false, missed: []};
  }
  function renderQPDrill(){
    var d = qpDrill;
    if (d.idx >= d.questions.length) {
      stopSpeech();
      var html = '<div class="quiz-summary"><div class="big-score">' + d.score + ' / ' + d.questions.length + '</div>';
      if (d.missed.length) {
        html += '<p class="count-note">要再聽一次：</p><ul>';
        d.missed.forEach(function(m){ html += '<li><strong>' + escapeHtml(m.jp) + '</strong> — ' + escapeHtml(m.zh) + '</li>'; });
        html += '</ul>';
      } else { html += '<p class="count-note">全對——完璧です！</p>'; }
      html += '<div class="start-row"><button class="btn primary" id="qpAgain">再來一次</button> <button class="btn" id="qpList">回到句型表</button></div></div>';
      content.innerHTML = html;
      document.getElementById("qpAgain").addEventListener("click", function(){ startQPDrill(); renderPatterns(); });
      document.getElementById("qpList").addEventListener("click", function(){ qpDrill = null; renderPatterns(); });
      return;
    }
    var q = d.questions[d.idx];
    var h = '<div class="quiz-feedback-row"><span class="quiz-q">設問 · 第 ' + (d.idx + 1) + ' 題／共 ' + d.questions.length + ' 題</span><span class="quiz-score-line">Score: ' + d.score + '</span></div>' +
      '<div class="listen-controls"><button class="btn primary" id="qpPlay">▶ 再播放</button><label class="listen-slow"><input type="checkbox" id="slowToggle"' + (listenSlow ? ' checked' : '') + '> 慢速</label></div>' +
      '<p class="count-note">這句在問什麼？（先聽，不看字）</p><div class="quiz-options">';
    q.options.forEach(function(opt, i){ h += '<button class="quiz-opt" data-i="' + i + '">' + escapeHtml(opt) + '<span class="quiz-mark"></span></button>'; });
    h += '</div><div id="qpReveal"></div><div class="start-row" id="qpNextWrap" style="display:none;"><button class="btn primary" id="qpNext">下一題</button></div>';
    content.innerHTML = h;
    var parts = [{t: qpAudio(q.jp), p: 1}];
    document.getElementById("qpPlay").addEventListener("click", function(){ speakSeq(parts); });
    document.getElementById("slowToggle").addEventListener("change", function(ev){ listenSlow = ev.target.checked; });
    speakSeq(parts);
    var btns = content.querySelectorAll(".quiz-opt");
    btns.forEach(function(b){
      b.addEventListener("click", function(){
        if (d.answered) return;
        d.answered = true;
        var chosen = q.options[parseInt(b.getAttribute("data-i"), 10)];
        if (chosen === q.zh) d.score++; else d.missed.push(q);
        btns.forEach(function(b2){
          b2.disabled = true;
          var o2 = q.options[parseInt(b2.getAttribute("data-i"), 10)], mk = b2.querySelector(".quiz-mark");
          if (o2 === q.zh) { b2.classList.add("correct"); mk.textContent = "◯"; }
          else if (b2 === b) { b2.classList.add("wrong"); mk.textContent = "✗"; }
        });
        document.getElementById("qpReveal").innerHTML = '<p class="num-note"><span class="t-jp">' + escapeHtml(q.jp) + '</span></p>';
        document.getElementById("qpNextWrap").style.display = "block";
      });
    });
    document.getElementById("qpNext").addEventListener("click", function(){ d.idx++; d.answered = false; stopSpeech(); renderQPDrill(); });
  }

          tl.addEventListener("click", function(){
            speakSeq([{t: tl.getAttribute("data-t"), p: parseFloat(tl.getAttribute("data-p")) || 1}]);

      });
    });

  var partFilter = "", partDrill = null;
  function renderParticles(){
    if (partDrill) { renderPartDrill(); return; }
    var side = '<aside class="side-filter"><p class="side-title">助詞 Particle</p><div class="tagbar"><button class="tag-chip' + (partFilter === "" ? " active" : "") + '" data-pp="">All</button>' +
      PARTICLES.map(function(x){ return '<button class="tag-chip' + (partFilter === x.p ? " active" : "") + '" data-pp="' + escapeHtml(x.p) + '">' + escapeHtml(x.p) + '</button>'; }).join("") + '</div></aside>';
    var main = '<p class="count-note">每個助詞的全部用法，附課別、說明、例句（點 🔊 聽）。下方「助詞練習」是 JLPT 最常見的填空題型。</p>' +
      '<div class="listen-controls"><button class="btn primary" id="partDrillBtn">助詞練習（10題）</button></div>';
    PARTICLES.forEach(function(x){
      if (partFilter && x.p !== partFilter) return;
      main += '<div class="p-card"><div class="p-head"><span class="p-big">' + escapeHtml(x.p) + '</span><span class="p-name">' + escapeHtml(x.name) + '</span></div>';
      x.uses.forEach(function(u){
        main += '<div class="p-use"><span class="seal-chip static">' + escapeHtml(u[0]) + '</span><div class="p-body"><div class="p-how">' + escapeHtml(u[1]) + '</div>' +
          '<div class="p-ex">' + escapeHtml(u[2]) + ' ' + speakerBtn(u[2]) + '</div><div class="t-zh">' + escapeHtml(u[3]) + '</div></div></div>';
      });
      main += '</div>';
    });
    content.innerHTML = '<div class="list-layout"><div class="list-main">' + main + '</div>' + side + '</div>';
    document.getElementById("partDrillBtn").addEventListener("click", function(){ startPartDrill(); renderParticles(); });
    content.querySelectorAll("[data-pp]").forEach(function(c){ c.addEventListener("click", function(){ partFilter = c.getAttribute("data-pp") || ""; renderParticles(); }); });
    wireSpeakers();
    updateFooterCount();
  }
  function startPartDrill(){
    var qs = shuffleArr(PARTICLE_DRILL).slice(0, 10).map(function(d){ return {q: d[0], a: d[1], options: shuffleArr(d[2]), zh: d[3]}; });
    partDrill = {questions: qs, idx: 0, score: 0, answered: false, missed: []};
  }
  function renderPartDrill(){
    var d = partDrill;
    if (d.idx >= d.questions.length) {
      var html = '<div class="quiz-summary"><div class="big-score">' + d.score + ' / ' + d.questions.length + '</div>';
      if (d.missed.length) {
        html += '<p class="count-note">要再看一次：</p><ul>';
        d.missed.forEach(function(m){ html += '<li>' + escapeHtml(m.q.replace("＿", "［" + m.a + "］")) + ' <span class="detail-sub">' + escapeHtml(m.zh) + '</span></li>'; });
        html += '</ul>';
      } else { html += '<p class="count-note">全對——完璧です！</p>'; }
      html += '<div class="start-row"><button class="btn primary" id="pAgain">再來一次</button> <button class="btn" id="pBack">回到助詞表</button></div></div>';
      content.innerHTML = html;
      document.getElementById("pAgain").addEventListener("click", function(){ startPartDrill(); renderParticles(); });
      document.getElementById("pBack").addEventListener("click", function(){ partDrill = null; renderParticles(); });
      return;
    }
    var q = d.questions[d.idx];
    var html2 = '<div class="quiz-feedback-row"><span class="quiz-q">助詞練習 · 第 ' + (d.idx + 1) + ' 題／共 ' + d.questions.length + ' 題</span><span class="quiz-score-line">Score: ' + d.score + '</span></div>';
    html2 += '<div class="quiz-jp p-q">' + escapeHtml(q.q).replace("＿", '<span class="p-blank">＿</span>') + '</div><div class="quiz-reading">' + escapeHtml(q.zh) + '</div>';
    html2 += '<div class="quiz-options p-opts">';
    q.options.forEach(function(opt){ html2 += '<button class="quiz-opt" data-r="' + escapeHtml(opt) + '">' + escapeHtml(opt) + '<span class="quiz-mark"></span></button>'; });
    html2 += '</div><div class="start-row" id="pNextWrap" style="display:none;"><button class="btn primary" id="pNext">下一題</button></div>';
    content.innerHTML = html2;
    var btns = content.querySelectorAll(".quiz-opt");
    btns.forEach(function(b){
      b.addEventListener("click", function(){
        if (d.answered) return;
        d.answered = true;
        var chosen = b.getAttribute("data-r");
        if (chosen === q.a) d.score++; else d.missed.push(q);
        btns.forEach(function(b2){
          b2.disabled = true;
          var mk = b2.querySelector(".quiz-mark");
          if (b2.getAttribute("data-r") === q.a) { b2.classList.add("correct"); mk.textContent = "◯"; }
          else if (b2.getAttribute("data-r") === chosen) { b2.classList.add("wrong"); mk.textContent = "✗"; }
        });
        var full = q.q.replace("＿", q.a).replace(/（[^）]*）$/, "");
        content.querySelector(".p-q").innerHTML = escapeHtml(full) + ' ' + speakerBtn(full);
        wireSpeakers();
        speak(full);
        document.getElementById("pNextWrap").style.display = "block";
      });
    });
    document.getElementById("pNext").addEventListener("click", function(){ d.idx++; d.answered = false; renderPartDrill(); });
  }

  // ---------- Flashcards ----------
  var fcState = { filter: "all", deck: [], pos: 0, flipped: false };

  function buildDeck(filter){
    var pool = entries.filter(function(e){ return (filter === "all" || e.category === filter) && e.jp.length <= 60; });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool;
  }

  function renderFlashcards(){
    if (fcState.deck.length === 0) {
      fcState.deck = buildDeck(fcState.filter);
      fcState.pos = 0;
      fcState.flipped = false;
    }
    var deck = fcState.deck;
    var html = '<div class="fc-controls">' +
      '<select id="fcFilter">' +
        '<option value="all"' + (fcState.filter === "all" ? " selected" : "") + '>All</option>' +
        '<option value="vocab"' + (fcState.filter === "vocab" ? " selected" : "") + '>Vocabulary</option>' +
        '<option value="phrase"' + (fcState.filter === "phrase" ? " selected" : "") + '>Phrases</option>' +
        '<option value="grammar"' + (fcState.filter === "grammar" ? " selected" : "") + '>Grammar</option>' +
      '</select>' +
      '<button class="btn" id="fcShuffle">Shuffle</button>' +
      '<span class="fc-progress">' + (deck.length ? (fcState.pos + 1) + ' / ' + deck.length : "0 / 0") + '</span>' +
    '</div>';

    if (!deck.length) {
      html += '<div class="empty-state">No entries in this set yet. Add some, or pick "All".</div>';
      content.innerHTML = html;
      wireFcControls();
      return;
    }

    var e = deck[fcState.pos];
    var canSpeak = e.category !== "grammar";
    html += '<div class="fc-stage"><div class="fc-card' + (fcState.flipped ? ' flipped' : '') + '" id="fcCard">' +
      '<div class="fc-card-inner">' +
        '<div class="fc-face front">' +
          '<div class="big-jp">' + escapeHtml(e.jp) + '</div>' +
          (e.reading ? '<div class="fc-reading">' + escapeHtml(e.reading) + '</div>' : '') +
          (canSpeak ? '<div class="fc-audio">' + speakerBtn(speakTextFor(e), "big") + '</div>' : '') +
          '<span class="hint">tap to flip</span>' +
        '</div>' +
        '<div class="fc-face back">' +
          '<div class="fc-meaning">' + escapeHtml(e.meaning) + '</div>' +
          (e.notes ? '<div class="fc-notes">' + escapeHtml(e.notes) + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div></div>';

    html += '<div class="fc-nav"><button class="btn" id="fcPrev">◀ Prev</button><button class="btn primary" id="fcNext">Next ▶</button></div>';

    content.innerHTML = html;
    wireFcControls();
    wireSpeakers();

    var card = document.getElementById("fcCard");
    card.addEventListener("click", function(){
      fcState.flipped = !fcState.flipped;
      card.classList.toggle("flipped", fcState.flipped);
    });
    document.getElementById("fcPrev").addEventListener("click", function(){
      fcState.pos = (fcState.pos - 1 + deck.length) % deck.length;
      fcState.flipped = false;
      renderFlashcards();
    });
    document.getElementById("fcNext").addEventListener("click", function(){
      fcState.pos = (fcState.pos + 1) % deck.length;
      fcState.flipped = false;
      renderFlashcards();
    });
  }
  function wireFcControls(){
    var sel = document.getElementById("fcFilter");
    if (sel) sel.addEventListener("change", function(){
      fcState.filter = sel.value;
      fcState.deck = [];
      renderFlashcards();
    });
    var sh = document.getElementById("fcShuffle");
    if (sh) sh.addEventListener("click", function(){
      fcState.deck = [];
      renderFlashcards();
    });
  }
